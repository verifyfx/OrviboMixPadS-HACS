name: Prepare release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify tag and build allowlisted asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/project.py package "$RELEASE_TAG"
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/orvibo_mixpad.zip dist/SHA256SUMS --verify-tag --generate-notes --draft --title "$RELEASE_TAG"
