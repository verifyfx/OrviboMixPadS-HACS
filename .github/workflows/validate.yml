name: Validate
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install cryptography ruff
      - run: ruff check .
      - run: python -m unittest discover -s tests -t . -v
      - run: python scripts/project.py package
      - uses: actions/upload-artifact@v4
        with:
          name: integration-package
          path: dist/*
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest-homeassistant-custom-component
      - run: python -m pytest tests_ha -q
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
          # Remote description/topics and a published release are maintainer steps.
          ignore: description topics
